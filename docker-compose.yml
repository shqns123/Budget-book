services:
  household-ledger:
    build:
      context: .
      network: host
    container_name: budget-book
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      NODE_ENV: production
      SQLITE_DATABASE_PATH: /app/data/ledger.db
    volumes:
      - ./data:/app/data
