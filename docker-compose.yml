services:
  household-ledger:
    build:
      context: .
      network: host
    container_name: budget-book
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      PORT: 3002
      TZ: Asia/Seoul
      NODE_ENV: production
      SQLITE_DATABASE_PATH: /app/data/ledger.db
    volumes:
      - ./data:/app/data
