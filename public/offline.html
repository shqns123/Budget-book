<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>잔잔한 가계부</title>
    <style>
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #fbe1d1; color: #17191c; font-family: Arial, "Apple SD Gothic Neo", sans-serif; }
      main { padding: 32px; text-align: center; }
      h1 { margin: 0 0 10px; font: 400 34px Georgia, serif; }
      p { margin: 0; color: #5d2a1a; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>잠시 연결이 끊겼어요.</h1>
      <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
    </main>
  </body>
</html>
